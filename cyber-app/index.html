<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Лучшие AI модели OpenCode Go: Intelligence, Визуал, Надёжность, Cost per Intelligence — киберпанк-версия." />
    <title>Лучшие AI модели — cyber</title>
    <script>
      // Тема до отрисовки, без мигания. Ключ свой, чтобы не спорить с главной и hi-tech.
      try {
        var t = localStorage.getItem("cyber-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        if (t !== "light" && t !== "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
