<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  /* Тема применяется до первой отрисовки, чтобы не мигало. Основная — светлая. */
  (function () {
    var theme;
    try { theme = localStorage.getItem("hitech-theme"); } catch (e) { theme = null; }
    if (theme !== "light" && theme !== "dark") theme = "light";
    document.documentElement.classList.toggle("dark", theme === "dark");
    document.documentElement.dataset.theme = theme;
    /* Цвет панели браузера на мобильных — сразу, до первой отрисовки. */
    var meta = document.createElement("meta");
    meta.name = "theme-color";
    meta.content = theme === "dark" ? "#0b0c0e" : "#ffffff";
    document.head.appendChild(meta);
  })();
</script>
</head>

<div id="root"></div>

</body>
