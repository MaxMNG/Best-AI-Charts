# Автосборка снимка данных.
#
# Запускает fetch-data.mjs на стороне GitHub и коммитит обновлённый data.js.
# Страница на GitHub Pages читает готовый файл, поэтому «живое» обновление
# живёт именно здесь: после коммита Pages публикует новый снимок сам.
name: Обновить данные

on:
  # 00:00 по Москве (UTC+3) = 21:00 UTC предыдущего дня.
  schedule:
    - cron: '0 21 * * *'
  # Ручной запуск со вкладки Actions.
  workflow_dispatch:

# Нужен коммит в репозиторий.
permissions:
  contents: write

# Сборки не должны накладываться друг на друга.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собрать свежие данные
        run: node fetch-data.mjs

      - name: Закоммитить data.js, если он изменился
        run: |
          if git diff --quiet -- data.js; then
            echo "data.js не изменился — коммит не нужен"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "data: автообновление $(date -u +%Y-%m-%d)"
          git push
